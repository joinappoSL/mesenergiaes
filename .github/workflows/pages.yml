# Publica el CRM en GitHub Pages en cada push a la rama principal de trabajo.
# Requisito (una sola vez): Settings → Pages → Source: «GitHub Actions».
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, claude/mesenergia-crm-app-nvwp59]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Compilar
        run: npm run build
        env:
          # La app se sirve en https://<usuario>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Valores públicos por diseño (van en el navegador); se pueden
          # sobrescribir con variables del repositorio.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://uvzqaqpzjdovblshexwb.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_eF6V6m--XLRYiOQ6I3VmKQ_wAqzv9oB' }}

      # GitHub Pages no conoce las rutas de la SPA: 404.html carga la app igualmente.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
