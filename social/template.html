<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--blue:#0E4D9D;--turq:#26B9CC;--white:#FFFFFF;--black:#000000;--soft:#EAF6FA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--white);font-family:'Inter','Inter Display',Arial,sans-serif;color:var(--blue)}
#stage{position:relative;width:1080px;height:1920px;background:var(--white);overflow:hidden}
.logo{mix-blend-mode:multiply}
#top{position:absolute;left:0;right:0;top:70px;display:flex;justify-content:center}
#top img{height:110px}
#bar{position:absolute;left:0;bottom:0;height:14px;background:var(--turq);width:0}
#deco1{position:absolute;right:-220px;top:430px;width:620px;height:620px;border-radius:50%;background:var(--soft)}
#deco2{position:absolute;left:-180px;bottom:260px;width:420px;height:420px;border-radius:50%;border:34px solid var(--soft)}
.scene{position:absolute;inset:0;padding:260px 80px 160px;display:flex;flex-direction:column;justify-content:center;opacity:0}
.big{font-size:118px;line-height:1.04;font-weight:900;letter-spacing:-3px;color:var(--blue)}
.big .w{display:inline-block;opacity:0;margin-right:22px}
.big .hl{color:var(--turq)}
.tag{display:inline-block;align-self:flex-start;background:var(--blue);color:#fff;font-weight:800;font-size:44px;padding:14px 30px;border-radius:999px;margin-bottom:46px;opacity:0}
.num{width:150px;height:150px;border-radius:44px;background:var(--turq);color:#fff;font-size:92px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-bottom:46px;opacity:0}
.head{font-size:100px;line-height:1.05;font-weight:900;letter-spacing:-2px;margin-bottom:40px;opacity:0}
.head .hl{color:var(--turq)}
.body{font-size:58px;line-height:1.28;font-weight:600;color:#1b2b44;opacity:0}
.body b{color:var(--blue);font-weight:900}
.term{margin-top:56px;background:#0B1B33;border-radius:36px;padding:38px 44px;font-family:'DejaVu Sans Mono',monospace;font-size:44px;line-height:1.5;color:#E6F7FB;opacity:0;white-space:pre-wrap;box-shadow:0 30px 60px rgba(14,77,157,.25)}
.term .c{color:var(--turq)}
.term .d{color:#7C93B2}
.ctawrap{align-items:center;text-align:center;justify-content:center}
.ctawrap img{width:640px;opacity:0}
.cta1{font-size:92px;font-weight:900;line-height:1.08;letter-spacing:-2px;margin-top:70px;opacity:0}
.cta1 .hl{color:var(--turq)}
.cta2{margin-top:50px;font-size:60px;font-weight:800;background:var(--blue);color:#fff;padding:26px 60px;border-radius:999px;opacity:0}
.cta3{margin-top:34px;font-size:46px;font-weight:600;color:#1b2b44;opacity:0}
</style></head>
<body><div id="stage">
<div id="deco1"></div><div id="deco2"></div>
<div id="top"><img class="logo" src="assets/logo_h.png"></div>
<div id="scenes"></div>
<div id="bar"></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const easeOut=p=>1-Math.pow(1-p,3);
const back=p=>{const c=1.70158+1;return 1+c*Math.pow(p-1,3)+1.70158*Math.pow(p-1,2)};
let SPEC=null,SC=[],TOTAL=0;
function hlify(s){return s.replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1</span>')}
function boldify(s){return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function termify(s){return s.split('\n').map(l=>l.startsWith('#')?'<span class="d">'+l+'</span>':l.startsWith('$')?'<span class="c">$</span>'+l.slice(1):l).join('\n')}
function init(spec){
  SPEC=spec;const root=document.getElementById('scenes');let t=0;
  spec.scenes.forEach((s,i)=>{
    const el=document.createElement('div');el.className='scene'+(s.type==='cta'?' ctawrap':'');
    const parts=[];
    if(s.type==='hook'){
      let h='';
      if(s.tag)h+=`<div class="tag" data-d="0">${s.tag}</div>`;
      const words=s.text.split(' ');let hl=false,k=0;
      h+='<div class="big">'+words.map(w=>{
        let cls='w';let ww=w;
        const open=ww.startsWith('**'),close=ww.endsWith('**');
        if(open){hl=true;ww=ww.slice(2)}
        const wasHl=hl;if(close){ww=ww.replace(/\*\*$/,'');hl=false}
        return `<span class="${cls}${wasHl?' hl':''}" data-d="${0.12+0.13*(k++)}" data-w="1">${ww}</span>`}).join(' ')+'</div>';
      el.innerHTML=h;
    }else if(s.type==='point'){
      let h=`<div class="num" data-d="0">${s.n}</div><div class="head" data-d="0.15">${hlify(s.head)}</div><div class="body" data-d="0.35">${boldify(s.body)}</div>`;
      if(s.code)h+=`<div class="term" data-d="0.6">${termify(s.code)}</div>`;
      el.innerHTML=h;
    }else if(s.type==='cta'){
      el.innerHTML=`<img class="logo" src="assets/logo_v.png" data-d="0"><div class="cta1" data-d="0.25">${hlify(s.line)}</div><div class="cta2" data-d="0.45">${s.button||'joinappo.com'}</div>${s.sub?`<div class="cta3" data-d="0.6">${s.sub}</div>`:''}`;
    }
    root.appendChild(el);
    SC.push({el,start:t,end:t+s.dur,dur:s.dur,items:[...el.querySelectorAll('[data-d]')]});
    t+=s.dur;
  });
  TOTAL=t;window.TOTAL=t;
}
function setT(t){
  SC.forEach(sc=>{
    const lt=t-sc.start;
    const inside=t>=sc.start&&t<sc.end;
    let op=0;
    if(inside){op=1;if(sc.end<TOTAL-0.001)op=clamp((sc.end-t)/0.18)}
    sc.el.style.opacity=op;
    if(!inside)return;
    sc.items.forEach(it=>{
      const d=parseFloat(it.dataset.d);
      const p=clamp((lt-d)/0.45);
      const isW=it.dataset.w;
      const e=isW?back(p):easeOut(p);
      it.style.opacity=clamp(p*2.2);
      it.style.transform=isW?`translateY(${(1-e)*70}px) scale(${0.85+0.15*e})`:`translateY(${(1-e)*60}px)`;
    });
  });
  document.getElementById('bar').style.width=(1080*clamp(t/TOTAL))+'px';
  const d1=document.getElementById('deco1'),d2=document.getElementById('deco2');
  d1.style.transform=`translate(${Math.sin(t*0.7)*30}px,${Math.cos(t*0.6)*40}px)`;
  d2.style.transform=`translate(${Math.cos(t*0.5)*40}px,${Math.sin(t*0.8)*30}px)`;
}
window.init=init;window.setT=setT;
</script></body></html>
