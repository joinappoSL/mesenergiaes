# Configuración para el entorno local de Supabase (supabase start).
# En el proyecto alojado, replica en el panel: Auth → Providers → Email
# ("Allow new users to sign up" desactivado) y Auth → URL Configuration.
project_id = "mesenergia-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/restablecer"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Los usuarios solo se crean desde la app (Edge Function admin-users).
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

[functions.admin-users]
verify_jwt = true

# Messy recibe el webhook de Whapi (sin JWT): valida su propia clave secreta
[functions.messy]
verify_jwt = false
